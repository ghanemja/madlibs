<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doodle Libs Cover</title>
  <!-- A cover/thumbnail for posts about the Mad Libs Turing Test.
       Sizes: ?size=story (1080x1920), ?size=feed (1080x1350, default), ?size=link (1200x627).
       Screenshot the #cover element at that size (tools/make_cover.js does it). -->
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #1b1530; --pink: #e8466b; --blue: #2a78d6; --orange: #eb6834; --mark: #ffe26a; --paper: #fffdf6; --font: "Patrick Hand", "Comic Sans MS", cursive; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #222; }
    #cover {
      position: relative; overflow: hidden; font-family: var(--font); color: var(--ink);
      background: #f4efe2; background-image: radial-gradient(rgba(0,0,0,.07) 2px, transparent 2px); background-size: 40px 40px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .tag { font-size: var(--tag); letter-spacing: .08em; color: #7a7466; }
    h1 { margin: .1em 0 0; font-size: var(--h1); line-height: 1.02; }
    h1 b { display: block; color: var(--pink); font-size: 1.32em; -webkit-text-stroke: 0; text-shadow: 4px 4px 0 #fff, -4px -4px 0 #fff, 4px -4px 0 #fff, -4px 4px 0 #fff; }
    .stage { position: relative; border: 7px solid var(--ink); border-radius: 30px; overflow: hidden; box-shadow: 12px 14px 0 rgba(0,0,0,.18); background: #fff; }
    .stage canvas { display: block; width: 100%; height: 100%; object-fit: cover; }
    .card { background: var(--paper); border: 6px solid var(--ink); border-radius: 26px; box-shadow: 10px 12px 0 rgba(0,0,0,.12); font-size: var(--card); line-height: 1.3; }
    .card .w { font-weight: bold; background: linear-gradient(transparent 52%, var(--mark) 52%); padding: 0 .1em; }
    .btns { display: flex; gap: var(--gap); justify-content: center; }
    .btn { border: 6px solid var(--ink); border-radius: 28px; color: #fff; font-weight: bold; font-size: var(--btn); padding: .12em .9em; box-shadow: 8px 10px 0 rgba(0,0,0,.25); }
    .btn.h { background: var(--blue); } .btn.a { background: var(--orange); }
    .foot { font-size: var(--foot); color: #5a544a; }
    .foot b { color: var(--ink); }
    .col { display: flex; flex-direction: column; align-items: center; gap: var(--gap); }

    /* layouts */
    .story { width: 1080px; height: 1920px; padding: 120px 50px; gap: 46px; --tag: 36px; --h1: 76px; --card: 54px; --btn: 92px; --foot: 38px; --gap: 40px; }
    .story .stage { width: 980px; height: 552px; } .story .card { width: 980px; padding: 34px 40px; }
    .feed { width: 1080px; height: 1350px; padding: 56px 50px; gap: 30px; --tag: 30px; --h1: 64px; --card: 44px; --btn: 72px; --foot: 30px; --gap: 30px; }
    .feed .stage { width: 960px; height: 400px; } .feed .card { width: 960px; padding: 22px 34px; }
    #cover.link { width: 1200px; height: 627px; padding: 36px 44px; flex-direction: row; gap: 40px; --tag: 22px; --h1: 46px; --card: 30px; --btn: 46px; --foot: 20px; --gap: 18px; }
    .link .stage { width: 560px; height: 420px; flex: none; } .link .card { width: 540px; padding: 14px 20px; } .link .col { flex: 1; }
  </style>
</head>
<body>
  <div id="cover">
    <div class="col left">
      <div class="tag">DOODLE LIBS · A MAD LIBS TURING TEST</div>
      <h1>Can you tell who wrote it?<b>HUMAN or AI?</b></h1>
    </div>
    <div class="stage"><canvas id="stage"></canvas></div>
    <div class="col right">
      <div class="card">“A hot air balloon is a type of <span class="w">sandwich</span>. It is lifted by <span class="w">exploding</span> the air inside the <span class="w">bread</span>.”</div>
      <div class="btns"><div class="btn h">HUMAN</div><div class="btn a">AI</div></div>
      <div class="foot"><b>ghanemja.github.io/madlibs</b><br>Stories: Microsoft Research’s Fun Libs · Human answers: YodaLib</div>
    </div>
  </div>

  <script src="../js/sketch.js"></script>
  <script src="../js/things.js"></script>
  <script src="../js/places.js"></script>
  <script src="../js/sfx.js"></script>
  <script src="../js/stage.js"></script>
  <script src="../js/verbs.js"></script>
  <script src="../js/lexicon.js"></script>
  <script src="../js/director.js"></script>
  <script>
    (function () {
      const size = new URLSearchParams(location.search).get('size') || 'feed';
      const cover = document.getElementById('cover');
      cover.className = size;
      // the link layout puts the stage on the left, text on the right
      if (size === 'link') { const st = cover.querySelector('.stage'); cover.querySelector('.left').prepend(st); cover.querySelector('.right').prepend(cover.querySelector('.left .tag'), cover.querySelector('.left h1')); }
      Sfx.on = false;
      Lex.init(VERBS, ADJS, ADVERBS);
      const cv = document.getElementById('stage');
      const S = new Stage(cv);
      const r = cv.getBoundingClientRect();
      S.fixedWidth = Math.round(r.width * 2); S.resize();
      // keep the canvas's own aspect: show the 16:9 scene centred, cropped to the box
      S.reset('park');
      const p = S.add('p', 'person', { x: 250, label: 'human?' }), bot = S.add('r', 'robot', { x: 720, dir: -1, label: 'AI?' });
      p.alive = bot.alive = true;
      p.pose = null;
      const tree = S.add('t', 'tree', { x: 480, scale: 0.9 }); tree.alive = true;
      window.coverReady = (async () => {
        await (document.fonts ? document.fonts.ready : Promise.resolve());
        await S.wait(0.6);
        S.act(p, 'jump'); S.act(bot, 'wave');
        S.act(tree, 'explode');
        await S.wait(0.42);
        S.speedMul = 0;                         // freeze mid-explosion for the still
        await new Promise((res) => setTimeout(res, 300));
        return true;
      })();
    })();
  </script>
</body>
</html>
